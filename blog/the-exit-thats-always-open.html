<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The exit that's always open — Vault Watch Blog</title>
  <meta name="description" content="A plain-language explainer of Morpho vaults' in-kind redemptions: why you can always leave, even when the vault has no cash on hand." />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
      background: #0b0b10; color: #e8e8ee;
      display: flex; flex-direction: column; height: 100vh;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 0.9rem 1.25rem;
      border-top: 2px solid #5b5bd6; border-bottom: 1px solid #26262e;
      font-size: 12px; letter-spacing: 0.15em; color: #9a9ab0;
    }
    .topbar a { color: #8b8bf0; text-decoration: none; }
    .viewer { flex: 1; border: none; width: 100%; }
    .fallback { padding: 2rem 1.25rem; text-align: center; }
    .fallback a {
      display: inline-block; margin-top: 0.8rem; padding: 0.6rem 1.1rem;
      border: 1px solid #5b5bd6; border-radius: 8px; background: #14142a;
      color: #cfd0ff; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span><a href="/blog/">← VAULTWATCH · BLOG</a></span>
    <span><a href="/blog/the-exit-thats-always-open.pdf" download>📄 DOWNLOAD PDF</a></span>
  </div>
  <embed class="viewer" src="/blog/the-exit-thats-always-open.pdf" type="application/pdf" />
  <noscript></noscript>
  <div class="fallback" hidden id="fallback">
    <p>Your browser can't display the PDF inline.</p>
    <a href="/blog/the-exit-thats-always-open.pdf" download>📄 Download the explainer</a>
  </div>
  <script>
    // Mobile browsers (notably iOS Safari) often refuse inline PDF embeds -
    // show the download fallback if the embed has no height after load.
    window.addEventListener("load", () => {
      const e = document.querySelector(".viewer");
      setTimeout(() => {
        if (!e.offsetHeight || e.offsetHeight < 50) {
          e.remove();
          document.getElementById("fallback").hidden = false;
        }
      }, 800);
    });
  </script>
</body>
</html>
